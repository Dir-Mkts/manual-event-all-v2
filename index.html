<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manual Maestro Conferencia — v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   DESIGN SYSTEM — WHITE / LIGHT MODE
   Palette: Crisp White + Slate + Indigo + Amber
   Typography: Plus Jakarta Sans
   ═══════════════════════════════════════════════ */
:root{
  /* ── LIGHT (default) ── */
  --bg:       #f0f2f5;
  --surface0: #ffffff;
  --surface1: #ffffff;
  --surface2: #f4f6f9;
  --surface3: #e8ecf2;
  --border:   #dde3ed;
  --border2:  #c8d0de;

  --text1: #0d1424;
  --text2: #3a4660;
  --text3: #7a86a0;

  --indigo:   #4f52d9;
  --indigo2:  #6366f1;
  --indigo-bg: #eef0fd;
  --amber:    #d97706;
  --amber2:   #f59e0b;
  --amber-bg: #fef3c7;
  --emerald:  #059669;
  --emerald-bg: #d1fae5;
  --rose:     #dc2626;
  --rose-bg:  #fee2e2;
  --violet:   #7c3aed;
  --violet-bg:#ede9fe;
  --cyan:     #0891b2;

  --gov:  #7c3aed;
  --f0:   #0891b2;
  --f1:   #0284c7;
  --f2:   #059669;
  --f3:   #d97706;
  --f4:   #dc2626;
  --eje:  #4f52d9;
  --ft:   #7c3aed;
  --pos:  #047857;
  --kpi:  #475569;

  --shadow-sm: 0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.05);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.10), 0 4px 8px rgba(0,0,0,.06);

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;

  font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
}

/* ── DARK MODE ── */
[data-theme="dark"]{
  --bg:       #0d1117;
  --surface0: #161b27;
  --surface1: #161b27;
  --surface2: #1e2538;
  --surface3: #262d42;
  --border:   #2a3350;
  --border2:  #364060;

  --text1: #f0f4ff;
  --text2: #a8b4d0;
  --text3: #64748b;

  --indigo:   #6366f1;
  --indigo2:  #818cf8;
  --indigo-bg: rgba(99,102,241,.15);
  --amber:    #f59e0b;
  --amber2:   #fbbf24;
  --amber-bg: rgba(245,158,11,.12);
  --emerald:  #10b981;
  --emerald-bg: rgba(16,185,129,.12);
  --rose:     #f43f5e;
  --rose-bg:  rgba(244,63,94,.12);
  --violet:   #8b5cf6;
  --violet-bg: rgba(139,92,246,.15);

  --gov:  #8b5cf6;
  --f0:   #06b6d4;
  --f1:   #0ea5e9;
  --f2:   #10b981;
  --f3:   #f59e0b;
  --f4:   #ef4444;
  --eje:  #6366f1;
  --ft:   #8b5cf6;
  --pos:  #059669;
  --kpi:  #64748b;

  --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.5);
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  background: var(--bg);
  color: var(--text1);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.65;
}

::-webkit-scrollbar{ width:6px; height:6px; }
::-webkit-scrollbar-track{ background:var(--bg); }
::-webkit-scrollbar-thumb{ background:var(--border2); border-radius:3px; }

/* ══════════════════════════════════════════
   TOP NAV
   ══════════════════════════════════════════ */
#topnav{
  position: sticky; top:0; z-index:100;
  background: color-mix(in srgb, var(--surface0) 95%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  min-height: 58px;
}
#topnav::-webkit-scrollbar{ display:none; }

#brand{
  font-size: 13px;
  font-weight: 800;
  color: var(--indigo);
  letter-spacing: .3px;
  white-space: nowrap;
  padding-right: 20px;
  margin-right: 10px;
  border-right: 1.5px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 7px;
}
#brand .dot{
  width:9px; height:9px;
  background: var(--amber2);
  border-radius:50%;
  box-shadow: 0 0 6px rgba(245,158,11,.5);
}

.nav-btn{
  background: none;
  border: none;
  color: var(--text3);
  cursor: pointer;
  padding: 7px 11px;
  font-size: 12.5px;
  font-weight: 600;
  font-family: inherit;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  border-radius: var(--r-sm);
  transition: all .15s;
  flex-shrink: 0;
}
.nav-btn .hint{
  font-size: 10px;
  font-weight: 600;
  color: var(--text3);
  background: var(--surface2);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--border);
}
.nav-btn:hover{
  color: var(--text1);
  background: var(--surface2);
}
.nav-btn.active{
  color: #fff;
  background: var(--phase-color, var(--indigo));
  box-shadow: 0 2px 10px color-mix(in srgb, var(--phase-color, var(--indigo)) 35%, transparent);
}
.nav-btn.active .hint{
  background: rgba(0,0,0,.12);
  color: rgba(255,255,255,.8);
  border-color: transparent;
}

/* ══════════════════════════════════════════
   ROLE BAR
   ══════════════════════════════════════════ */
#rolebar{
  background: var(--surface0);
  border-bottom: 1px solid var(--border);
  padding: 10px 24px;
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  align-items: center;
}
#rolebar-label{
  font-size: 11px;
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .7px;
  margin-right: 4px;
}

.role-btn{
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text2);
  border-radius: 20px;
  padding: 5px 15px;
  font-size: 12.5px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all .15s;
  box-shadow: var(--shadow-sm);
}
.role-btn:hover{
  border-color: var(--border2);
  color: var(--text1);
  background: var(--surface3);
}
.role-btn.active{
  background: var(--indigo);
  border-color: var(--indigo);
  color: #fff;
  box-shadow: 0 2px 8px rgba(79,82,217,.3);
}
.role-count{
  background: rgba(0,0,0,.12);
  border-radius: 10px;
  padding: 1px 7px;
  font-size: 10px;
  font-weight: 700;
}
.role-btn.active .role-count{
  background: rgba(255,255,255,.25);
}

/* ══════════════════════════════════════════
   MAIN — FULL WIDTH
   ══════════════════════════════════════════ */
#main{
  padding: 28px 24px;
  width: 100%;
  max-width: 100%;
}

@media(min-width:1200px){
  #main{
    padding: 32px 40px;
  }
}
@media(min-width:1600px){
  #main{
    padding: 36px 56px;
  }
}

/* ══════════════════════════════════════════
   HOME
   ══════════════════════════════════════════ */
.home-hero{
  text-align: center;
  padding: 52px 20px 40px;
  position: relative;
}
.home-hero::before{
  content:'';
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:500px; height:300px;
  background: radial-gradient(ellipse at center, rgba(99,102,241,.06) 0%, transparent 70%);
  pointer-events:none;
}
.home-badge{
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--amber-bg);
  border: 1px solid rgba(217,119,6,.2);
  color: var(--amber);
  font-size: 11px;
  font-weight: 700;
  padding: 5px 14px;
  border-radius: 20px;
  margin-bottom: 18px;
  letter-spacing: .5px;
  text-transform: uppercase;
}
.home-hero h1{
  font-size: 32px;
  font-weight: 800;
  color: var(--text1);
  line-height: 1.2;
  margin-bottom: 12px;
}
.home-hero h1 span{ color: var(--indigo); }
.home-hero p{
  color: var(--text2);
  font-size: 15px;
  font-weight: 500;
}

.phase-grid{
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
  margin-top: 36px;
}

@media(min-width:1400px){
  .phase-grid{ grid-template-columns: repeat(6, 1fr); }
}

.phase-card{
  background: var(--surface0);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: 22px;
  cursor: pointer;
  transition: all .2s;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.phase-card::before{
  content:'';
  position:absolute; top:0; left:0; right:0; height:3px;
  background: var(--c, var(--indigo));
}
.phase-card:hover{
  border-color: var(--c, var(--indigo));
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
}
.phase-card .icon{
  font-size: 22px;
  margin-bottom: 10px;
  display: block;
}
.phase-card h3{
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text1);
  margin-bottom: 4px;
  line-height: 1.3;
}
.phase-card p{
  font-size: 12px;
  color: var(--text3);
  font-weight: 500;
}

/* ══════════════════════════════════════════
   SECTION HEADER
   ══════════════════════════════════════════ */
.section-header{
  margin-bottom: 24px;
  padding-bottom: 18px;
  border-bottom: 2px solid var(--border);
}
.section-header h2{
  font-size: 22px;
  font-weight: 800;
  color: var(--text1);
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-header p{
  color: var(--text2);
  font-size: 15px;
  margin-top: 7px;
  line-height: 1.65;
  font-weight: 500;
}

/* GATE BOX */
.gate-box{
  background: var(--amber-bg);
  border: 1px solid rgba(217,119,6,.22);
  border-radius: var(--r-md);
  padding: 15px 20px;
  margin: 18px 0;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.gate-box .lock{ font-size:19px; flex-shrink:0; margin-top:1px; }
.gate-box p{ font-size: 14px; color: #92400e; font-weight: 500; line-height:1.6; }
.gate-box strong{ color: #78350f; font-weight: 700; }

/* ══════════════════════════════════════════
   STATUS SELECTOR
   ══════════════════════════════════════════ */
.status-row{
  display: flex;
  gap: 5px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.status-btn{
  padding: 4px 11px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text3);
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.status-btn:hover{ border-color: var(--border2); color: var(--text2); }
.status-btn.s-pending.on{ background: var(--surface3); color: var(--text2); border-color: var(--border2); }
.status-btn.s-active.on{ background: var(--indigo-bg); color: var(--indigo); border-color: var(--indigo); }
.status-btn.s-done.on{ background: var(--emerald-bg); color: var(--emerald); border-color: var(--emerald); }
.status-btn.s-blocked.on{ background: var(--rose-bg); color: var(--rose); border-color: var(--rose); }

/* Per-step status button */
.step-status-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px 3px 7px;
  border-radius:20px;
  border:1.5px solid var(--border2);
  background:var(--surface2);
  cursor:pointer;flex-shrink:0;
  font-size:11.5px;font-weight:700;
  transition:all .15s;
  color:var(--text3);
  font-family:inherit;
  white-space:nowrap;
  margin-top:1px;
  user-select:none;
}
.step-status-btn:hover{filter:brightness(.96);border-color:var(--border2);}
.step-status-btn .ss-icon{font-size:12px;line-height:1;}
.step-status-btn[data-status="active"]{background:var(--indigo-bg);border-color:var(--indigo);color:var(--indigo);}
.step-status-btn[data-status="done"]{background:var(--emerald-bg);border-color:var(--emerald);color:var(--emerald);}
.step-status-btn[data-status="blocked"]{background:var(--rose-bg);border-color:var(--rose);color:var(--rose);}
.check-label.blocked{color:var(--rose);text-decoration:line-through;opacity:.7;}

/* Phase progress on home cards */
.phase-prog-wrap{
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.phase-prog-bar{
  height: 5px;
  background: var(--surface3);
  border-radius: 3px;
  overflow: hidden;
}
.phase-prog-fill{
  height: 100%;
  border-radius: 3px;
  background: var(--c, var(--indigo));
  transition: width .4s cubic-bezier(.4,0,.2,1);
}
.phase-prog-label{
  font-size: 11px;
  color: var(--text3);
  font-weight: 600;
}

/* ══════════════════════════════════════════
   PROC CARDS — GRID EN DESKTOP
   ══════════════════════════════════════════ */
.proc-grid{
  display: grid;
  gap: 14px;
}

@media(min-width:1100px){
  .proc-grid{ grid-template-columns: 1fr 1fr; }
}
@media(min-width:1600px){
  .proc-grid{ grid-template-columns: 1fr 1fr 1fr; }
}

.proc-card{
  background: var(--surface0);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  overflow: hidden;
  transition: box-shadow .2s, border-color .2s;
  box-shadow: var(--shadow-sm);
}
.proc-card:hover{ box-shadow: var(--shadow-md); border-color: var(--border2); }
.proc-card.hidden{ display:none; }

.proc-header{
  padding: 18px 20px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
  position: relative;
}
.proc-header::before{
  content:'';
  position:absolute; left:0; top:14px; bottom:14px; width:4px;
  background: var(--c, var(--indigo));
  border-radius: 0 3px 3px 0;
}
.proc-header:hover{ background: var(--surface2); }

.proc-meta{ flex:1; }

.proc-code{
  font-size: 11px;
  font-weight: 800;
  color: var(--c, var(--indigo));
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.proc-title{
  font-size: 15.5px;
  font-weight: 700;
  color: var(--text1);
  line-height: 1.3;
  margin-bottom: 10px;
}
.proc-info{
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

.badge{
  font-size: 11.5px;
  padding: 3px 10px;
  border-radius: 6px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.badge-owner{
  background: var(--indigo-bg);
  color: var(--indigo);
  border: 1px solid rgba(79,82,217,.18);
}
.badge-window{
  background: var(--surface2);
  color: var(--text2);
  border: 1px solid var(--border);
}
.badge-type{
  background: var(--emerald-bg);
  color: var(--emerald);
  border: 1px solid rgba(5,150,105,.18);
}
.badge-type.puntual{
  background: var(--amber-bg);
  color: var(--amber);
  border: 1px solid rgba(217,119,6,.18);
}

/* Progress */
.progress-wrap{ margin-top: 12px; }
.progress-label{
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text3);
  font-weight: 600;
  margin-bottom: 5px;
}
.progress-bar{
  height: 7px;
  background: var(--surface3);
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill{
  height: 100%;
  border-radius: 4px;
  background: var(--c, var(--indigo));
  transition: width .4s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 0 6px color-mix(in srgb, var(--c, var(--indigo)) 40%, transparent);
}

.proc-toggle{
  width: 30px; height: 30px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex; align-items:center; justify-content:center;
  font-size: 13px;
  color: var(--text3);
  flex-shrink: 0;
  margin-top: 2px;
  transition: all .15s;
}
.proc-header:hover .proc-toggle{
  background: var(--surface3);
  color: var(--text1);
}

/* PROC BODY */
.proc-body{
  display: none;
  padding: 0 20px 20px;
  border-top: 1px solid var(--border);
  background: var(--surface2);
}
.proc-body.open{ display:block; }

.dep-box{
  background: rgba(217,119,6,.07);
  border: 1px solid rgba(217,119,6,.18);
  border-radius: var(--r-sm);
  padding: 10px 14px;
  margin: 14px 0;
  font-size: 13.5px;
  color: #92400e;
  font-weight: 500;
}
.hitos-box{
  background: var(--violet-bg);
  border: 1px solid rgba(124,58,237,.18);
  border-radius: var(--r-sm);
  padding: 12px 16px;
  margin: 14px 0;
  font-size: 14px;
  color: var(--violet);
  font-weight: 500;
}
.hitos-box strong{ color: #5b21b6; font-weight: 700; }

/* Steps */
.steps-list{ margin: 16px 0; }
.steps-label{
  font-size: 11px;
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .7px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.steps-label::after{
  content:'';
  flex:1;
  height:1px;
  background: var(--border);
}

.step-item{
  display: flex;
  gap: 12px;
  margin-bottom: 8px;
  align-items: flex-start;
  padding: 10px 12px;
  border-radius: var(--r-sm);
  background: var(--surface0);
  border: 1px solid var(--border);
  transition: border-color .15s;
}
.step-item:hover{ border-color: var(--border2); }

.step-num{
  background: color-mix(in srgb, var(--c, var(--indigo)) 12%, transparent);
  border: 1.5px solid color-mix(in srgb, var(--c, var(--indigo)) 30%, transparent);
  color: var(--c, var(--indigo));
  border-radius: 8px;
  width: 26px; height: 26px;
  display: flex; align-items:center; justify-content:center;
  font-size: 11.5px;
  font-weight: 800;
  flex-shrink: 0;
  margin-top: 1px;
}
.step-text{
  font-size: 14px;
  color: var(--text1);
  line-height: 1.65;
  font-weight: 500;
}

/* Checklist */
.check-item{
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 7px;
  padding: 10px 12px;
  border-radius: var(--r-sm);
  background: var(--surface0);
  border: 1px solid var(--border);
  transition: border-color .15s;
  cursor: pointer;
}
.check-item:hover{ border-color: var(--border2); }
.check-item input[type=checkbox]{
  margin-top: 3px;
  accent-color: var(--c, var(--indigo));
  width: 15px; height: 15px;
  flex-shrink: 0;
  cursor: pointer;
}
.check-label{
  font-size: 14px;
  color: var(--text1);
  line-height: 1.65;
  cursor: pointer;
  font-weight: 500;
}
.check-label.checked{
  color: var(--text3);
  text-decoration: line-through;
}

/* Meta grid */
.meta-grid{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 14px 0;
}
.meta-box{
  background: var(--surface0);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 14px;
}
.meta-box.full{ grid-column:1/-1; }
.meta-box h4{
  font-size: 11px;
  font-weight: 800;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .7px;
  margin-bottom: 7px;
}
.meta-box p{
  font-size: 13.5px;
  color: var(--text1);
  line-height: 1.65;
  font-weight: 500;
}
.meta-box.warn{
  background: var(--rose-bg);
  border-color: rgba(220,38,38,.18);
}
.meta-box.warn h4{ color: var(--rose); }

  {id:'f2-01',code:'F2-01',stage:'f2',title:'Selección de sedes y actividades externas',owner:'COO',support:'Eventos / Transporte / Marketing',window:'T-6 a T-2 meses',type:'puntual',roles:['coo','eventos','marketing'],dep:'F0-01 agenda preliminar + F0-02 hotel confirmado.',
   steps:['Relacionar cada actividad con formato, aforo realista, objetivo, ambiente, horario y necesidad de salida del hotel.','Evaluar lugar, acceso, clima, baños, electricidad, audio, vecinos, exclusividad, servicio de alimentos y alternativas bajo techo.','Realizar visita técnica; fotografiar espacios y dibujar plano de asistentes, escenario, montaje y transporte.','Negociar contrato, permisos, fechas de montaje, póliza de seguros si aplica y horario de terminación.','Integrar culturalmente entretenimiento local sin afectar los bloques de reuniones de negocio.','Confirmar ubicación y punto de encuentro de buses, ventana de carga/descarga, tránsito y tiempos de transferencia.'],
   evidence:'Ficha técnica, contrato y plan de contingencia de cada sede.',control:'Una sede externa no se considera lista sin transporte/operación de regreso y aforo permitido.',deviation:'Ante lluvia u otra suspensión: usar sede alterna o formato reducido aprobado y avisar por canal oficial.'},
  {id:'f2-02',code:'F2-02',stage:'f2',title:'Programación artística y catering',owner:'COO',support:'Marketing / Hotel / Eventos',window:'T-4 meses hasta cada actividad',type:'puntual',roles:['coo','marketing','eventos'],dep:'F2-01 sedes / F2-03 AV.',
   steps:['Definir concepto cultural por evento; contratar agrupaciones locales, DJ o show según aforo, tipo de público y duración.','Revisar permisos, seguridad de efectos especiales, rider técnico, acceso de artistas y horarios de ensayo.','Diseñar menús por tipo de evento: canapés en cócteles y despedida; coffee break continuo en One-to-One; buffet ágil para gala.','Solicitar información sobre restricciones alimentarias, alergias, opciones vegetarianas y servicio sin alcohol.','Asegurar estaciones espejo de buffet en gala para reducir filas; coordinar personal y reposición.','Confirmar que el ambiente y la comida transmitan el carácter de gala, bienvenida o fiesta de despedida sin afectar protocolo.'],
   evidence:'Menús aprobados, ficha de show, rider, permisos y cronograma de servicio.',control:'Las máquinas de toques, fuego y efectos eléctricos son ejemplos 2026, no estándares; evaluar riesgos y sustituir por entretenimiento seguro cuando convenga.',deviation:'Si proveedor cancela, usar opción de sustitución aprobada y comunicar impacto.'},
  {id:'f2-03',code:'F2-03',stage:'f2',title:'Audio, video, iluminación y pruebas',owner:'COO',support:'Marketing / Producción / Sistemas',window:'T-4 meses a cada evento',type:'puntual',roles:['coo','marketing','sistemas'],dep:'F1-02 compromisos de sponsors.',
   steps:['Levantar necesidades independientes para cóctel, inauguración, sesiones 1:1, gala y despedida, sin sobredimensionar áreas.','Cotizar pantalla principal, pantallas secundarias, bocinas, micrófonos, operador, iluminación, proyector, cableado y montaje/desmontaje.','Comparar propuestas técnica y económicamente; exigir rider de artistas, rutas de cable seguras y plan de energía.','Contratar incluyendo fechas y horarios de montaje, prueba, operación, desmontaje y respaldo de equipo.','Solicitar archivos y videos con anticipación y probar audio, formato, resolución y orden de reproducción.','Realizar ensayo con presentador, técnico AV y protocolo antes de cada ceremonia.'],
   evidence:'Rider técnico autorizado, pruebas firmadas y lista de reproducción final versionada.',control:'Todo video de sponsor se marca como visto y aprobado por segundo revisor; verificar no solo que el archivo exista, sino que sí se proyecte.',deviation:'Ante falla, operador AV activa respaldo local y micrófono alternativo.'},

  {id:'f3-01',code:'F3-01',stage:'f3',title:'Reuniones One-to-One y scheduler',owner:'Sistemas',support:'Ventas / Eventos / COO',window:'T-3 meses a fin de reuniones',type:'puntual',roles:['sistemas','ventas','coo','eventos'],dep:'F1-03 base de asistentes / F0-02 salón.',
   steps:['Definir fecha de apertura/cierre del scheduler con Ventas y COO.','Informar a los agentes duración de 20 minutos, reglas de invitación, cancelación y No Show.','Configurar horarios, disponibilidad, mesas VIP fijas y asignación de mesas rotativas.','Calcular pico de simultaneidad por franja; asignar al menos ese número de mesas y prever de 2 a 5 adicionales según espacio.','Verificar agendas impresas o digitales con empresa, contraparte, hora y número de mesa.','Realizar pruebas de autenticación, impresiones, red, cronómetro, pantallas de anuncios y modo de contingencia.','Cerrar y congelar agenda según plazo comunicado, conservando procedimiento para cambios autorizados.'],
   evidence:'Matriz de aforo por franja, planos de mesas, agendas individuales y pruebas documentadas.',control:'Si pico=40 reuniones simultáneas, planificar mínimo 40 mesas y 2–5 de reserva si cabe.',deviation:'Falla del sistema: entregar agendas exportadas/impresas y bitácora manual de cambios.'},
  {id:'f3-02',code:'F3-02',stage:'f3',title:'Transporte y confirmación de asistencia',owner:'Coordinación de Eventos',support:'Marketing / Ventas / COO',window:'T-3 meses hasta cada retorno',type:'continuo',roles:['eventos','marketing','ventas','coo'],hitos:'Contratación de unidades en F3 · Confirmaciones por actividad en F4 · Manifiestos y conteo en F5.',dep:'F2-01 actividades externas.',
   steps:['Clasificar traslados aeropuerto-hotel, hotel-evento externo y retornos; definir qué está incluido y qué se paga directamente.','Abrir confirmación por actividad; preferir un enlace único con cierre, cupos, cambios y listado descargable.','Conciliar confirmados con capacidad y contratar unidades con holgura razonable, evitando sobrecontratación.','Definir horarios, punto de encuentro, rutas, responsables, teléfonos y política de no-show/cancelación.','Enviar confirmación antes de cada actividad e informar explícitamente la hora límite de abordaje.','Designar contador de salida y responsable de bus; registrar asistentes subidos, salidas y regresos.','Preparar plan de espera, unidad adicional o transporte alternativo para picos y viajeros rezagados.'],
   evidence:'Manifiestos de pasajeros por actividad, rutas y contrato con capacidad contratada.',control:'Comparar confirmados versus abordados; revisar la desviación de capacidad para optimizar próximos eventos.',deviation:'Nunca obligar a abordar a quien prefiera regresar por cuenta propia.'},
  {id:'f3-03',code:'F3-03',stage:'f3',title:'Kits de bienvenida y productos patrocinados',owner:'Marketing / Eventos',support:'Ventas / Sistemas / Proveedores',window:'T-4 meses hasta registro',type:'puntual',roles:['marketing','eventos','ventas','sistemas'],dep:'F1-03 asistentes confirmados / F3-01 agendas.',
   steps:['Definir composición del kit: mochila, playera personalizada, bloc, pluma, set de escritorio, gafete/lanyard, agenda One-to-One y artículos adicionales.','Solicitar propuestas y muestras, medir utilidad, visibilidad del sponsor y vida útil del obsequio.','Aprobar artes, tallas, nombres, cantidad de invitados, repuestos y calendario de producción con tiempo para reimpresión.','Validar productos especiales (pluma con tecnología RFID/NFC, lanyard-cable de carga) y probar compatibilidad real.','Recibir por lote, contar, cotejar calidad y clasificar alfabéticamente; preparar kit de contingencia para recién llegados/cambios.','Incluir agenda individual tras cierre del scheduler y verificar que coincida con gafete y empresa.','Registrar entrega contra lista; separar kits de asistentes cancelados o no presentados.'],
   evidence:'Inventario con cantidades, muestras aprobadas, acta de recepción y listado de entrega.',control:'No usar cantidades históricas como metas universales. La playera de grupo debe estar disponible antes de la foto oficial.',deviation:'Si falta material, entregar constancia y fecha de entrega/reembolso autorizada.'},
  {id:'f3-04',code:'F3-04',stage:'f3',title:'Protocolos, reconocimientos y escaletas',owner:'Marketing / COO',support:'CEO / Ventas / Producción',window:'T-2 meses a cada acto',type:'continuo',roles:['marketing','coo','ventas'],hitos:'Borrador de escaletas en F3 · Validación de listas en F4 · Ensayo y congelamiento en F4 (T-7 días) · Ejecución en F5.',dep:'F1-02 matriz de sponsors / F3-01 programa.',
   steps:['Crear inventario de momentos: cóctel, corte de listón, nuevos miembros, invitados, cumpleaños, premios, gala y despedida.','Solicitar a Ventas/CEO lista de personas, cargos, pronunciación de nombres, orden y categoría.','Asignar presentador, discursos, minutos previstos, reconocimientos físicos, videos y señas de AV.','Preparar guion y escaleta con hora prevista, responsable de escenario, archivo, micrófono y entregador.','Hacer doble cotejo de listas de sponsors, nuevos miembros, BPS, trayectorias, staff y premios.','Ensayar intervenciones y confirmar asistencia real de quien recibirá reconocimientos.','Marcar cada segmento ejecutado en mesa de control antes de cerrar ceremonia.'],
   evidence:'Escaleta final minuto a minuto, hoja de protocolo y acta de pruebas de video/placas.',control:'No reutilizar listas antiguas sin validarlas; la omisión de un sponsor es una incidencia crítica.',deviation:'Ausencia del homenajeado: establecer suplente o reconocer sin foto individual, con aprobación.'},
  {id:'f3-05',code:'F3-05',stage:'f3',title:'Seguros, permisos y plan de contingencia',owner:'COO',support:'Marketing / Producción / Finanzas',window:'T-3 meses a T-7 días',type:'puntual',roles:['coo','marketing','finanzas'],dep:'F2-01 sedes / F2-02 shows.',
   steps:['Evaluar cobertura de responsabilidad civil para actividades externas, shows, alcohol y deportes.','Tramitar permisos locales y de uso de suelo para eventos en espacio público o semi-público.','Preparar plan de evacuación, rutas de emergencia y contactos de servicios de salud para cada sede.','Comunicar protocolo de seguridad al equipo, proveedores y, cuando proceda, a los asistentes.','Documentar los planes de contingencia de cada actividad (lluvia, falla eléctrica, ausencia de proveedor, incidente médico).'],
   evidence:'Pólizas o confirmaciones de seguro, permisos obtenidos y planes de contingencia por actividad.',control:'Ninguna actividad con riesgo elevado (shows pirotécnicos, deporte, alcohol) arranca sin seguro y permiso firmado.'},

  {id:'f4-01',code:'F4-01',stage:'f4',title:'Conciliaciones y cierres financieros previos al evento',owner:'COO / Administración',support:'CEO / Ventas',window:'T-30 días a T-0',type:'puntual',roles:['coo','finanzas','ventas'],
   steps:['Verificar que todos los anticipos a hotel y proveedores críticos estén liquidados según contratos.','Cerrar rooming list de cambios (congelar solicitudes de nuevo ingreso o modificación).','Revisar cobros pendientes de agentes e inscripciones; gestionar excepciones autorizadas.','Preparar listado de cuentas por cobrar/pagar que quedarán para T+1 a T+7.'],
   evidence:'Estado de cobros/pagos previo al evento con responsable y fecha de cada excepción.'},
  {id:'f4-02',code:'F4-02',stage:'f4',title:'Mensajería y orientación al participante',owner:'Marketing',support:'Ventas / Sistemas',window:'T-30 días a T-1 día',type:'puntual',roles:['marketing','ventas','sistemas'],dep:'F1-03 base de inscritos.',
   steps:['Enviar correo/mensaje de bienvenida con instrucciones de llegada, check-in, kits y actividades.','Comunicar puntos de encuentro, horarios de registro, código de vestimenta y reglas de transporte.','Repetir mensaje de transporte antes de cierre de registros, y de cada evento externo la víspera.','Mantener un canal de respuesta rápida para preguntas operativas de asistentes.','Publicar recordatorio de no-show del scheduler y consecuencias.'],
   evidence:'Bitácora de mensajes enviados, respuestas y casos atendidos.',control:'El canal social no reemplaza la comunicación oficial; toda instrucción operativa debe ir por correo o mensaje formal.'},
  {id:'f4-03',code:'F4-03',stage:'f4',title:'Go/No-Go y llegada del staff',owner:'COO',support:'Todas las áreas',window:'T-7 a T-0',type:'puntual',roles:['coo','ventas','marketing','sistemas','finanzas','eventos'],dep:'Todos los procedimientos F0-02 a F3-05 completos.',
   steps:['Convocar reunión de revisión con todas las áreas; verificar actividad por actividad que cada dependencia esté resuelta.','Emitir resolución Go / Go condicionado / No-Go por cada actividad del programa.','Confirmar llegada del staff, roles, turno, uniforme, credencial y número de contacto.','Distribuir plan de comunicación de staff: radios, grupos de WhatsApp operativos y árbol de escalamiento.','Realizar walkthrough en hotel: registro, salones, áreas sociales, almacenamiento, AV, señalética y puntos de emergencia.','Dejar acta firmada con pendientes resueltos o con responsable y hora máxima de cierre.'],
   evidence:'Acta de Go/No-Go por actividad, lista de staff con roles y contactos, walkthrough completado.',control:'El acta de Go/No-Go es el semáforo operativo; ningún COO debe habilitarlo con pendientes críticos abiertos.',deviation:'Pendiente crítico sin solución a T-1: escalar inmediatamente al CEO con opciones y costos.'},

  {id:'eje-00',code:'EJE-00',stage:'eje',title:'Día previo no oficial — integración social',owner:'COO / Ventas',support:'Marketing',window:'Día -1 (tarde-noche)',type:'puntual',roles:['coo','ventas','marketing'],dep:'F3-02 transporte confirmado; F1-04 rooming list con llegadas esperadas.',steps:['Este día no forma parte del programa oficial; sin embargo, aprovechar la llegada temprana para generar un primer punto de contacto informal entre asistentes.','Elegir un venue accesible desde el hotel, con reservación o cupo suficiente y fácil regreso.','Comunicar el lugar, hora y punto de reunión a los asistentes confirmados con llegada ese día; aclarar que es actividad opcional y sin costo cubierto o indicar qué cubre Americas Alliance.','Designar al menos un miembro del equipo como anfitrión; no es necesario staff completo.','Confirmar que las llegadas al hotel ya tienen habitación asignada y kit disponible o programado para el día siguiente.','Registrar asistencia real para contraste con reservaciones del hotel.'],evidence:'Bitácora de llegadas del día y nota de asistencia a la reunión informal.',control:'No realizar compromisos de patrocinio, discursos ni actos protocolares en el día previo; ese día es social, no oficial.',deviation:'Si hay muy pocas llegadas, el anfitrión puede cancelar sin comunicado masivo.'},
  {id:'eje-01',code:'EJE-01',stage:'eje',title:'Día 1 — Registro, hospitalidad y entrega de kits',owner:'Eventos / Staff de registro',support:'Ventas / Hotel / Sistemas',window:'Día 1 · tarde (ventana aprox. 15:00–19:00)',type:'puntual',roles:['eventos','ventas','sistemas'],dep:'F3-03 kits listos y clasificados; F1-04 rooming list conciliada; F3-01 agendas impresas/digitales.',steps:['Montar mesa de registro en área acordada con el hotel: banner o señalética de AA, kits ordenados alfabéticamente, lista de asistentes, bolígrafos y sello o credencial si aplica.','Colocar señalética interna desde la entrada del hotel hasta el punto de registro.','Habilitar mesa de tours o actividades opcionales con información y precios claros.','Verificar instalación de pared gráfica o backdrop para fotos en área de bienvenida.','Dos personas mínimo en mesa de registro: una entrega kit y verifica nombre, otra resuelve dudas y registra incidencias.','Entregar agenda individual (scheduler) verificando que coincida con el gafete y la empresa.','Registrar cada entrega contra lista; separar kits de cancelados o no presentados.','Mantener un kit de contingencia para llegadas tardías, cambios de nombre o invitados de último momento.'],evidence:'Lista de entrega firmada o marcada; inventario residual; reporte de incidencias de registro.',control:'No cerrar mesa de registro antes de confirmar que el 90% de los esperados ese día ya llegó o de tener ETA de los restantes.',deviation:'Kit faltante: entregar constancia escrita y fecha/método de envío posterior autorizado.'},
  {id:'eje-02',code:'EJE-02',stage:'eje',title:'Día 1 — Cóctel de bienvenida',owner:'COO / Eventos',support:'Marketing / AV / Hotel',window:'Día 1 · noche (aprox. 20:00–23:00)',type:'puntual',roles:['coo','eventos','marketing'],dep:'EJE-01 registro completado; F1-02 beneficios del host sponsor verificados; F3-04 escaleta aprobada; F2-03 AV montado y probado.',steps:['Verificar montaje del salón: configuración de mesas o standing, decoración, barras de bebidas, música ambiental y accesos.','Confirmar que el host sponsor del país anfitrión y los sponsors del cóctel tienen sus materiales en posición.','Revisar escaleta: presentación institucional de AA, palabras de bienvenida del CEO, presentación del host sponsor, brindis oficial y momento fotográfico.','Coordinar con AV: micrófonos probados, música en pausa para discursos, pantalla con contenido correcto y video del sponsor activo si aplica.','Confirmar menú del cóctel: canapés, opciones sin alcohol y servicio de barra.','Preparar momento de honores o reconocimientos si está en escaleta.','Designar fotógrafo y videógrafo con lista de tomas obligatorias.','Asignar un miembro del equipo como enlace de operación durante el evento.'],evidence:'Escaleta ejecutada con hora real de cada momento; fotos de tomas obligatorias; registro de incidencias.',control:'El discurso del sponsor se confirma con el representante designado antes del evento.',deviation:'Falla de AV: continuar con micrófono inalámbrico de respaldo; retrasar discursos máximo 10 minutos.'},
  {id:'eje-03',code:'EJE-03',stage:'eje',title:'Día 2 — Apertura oficial y corte de listón',owner:'CEO / COO',support:'Marketing / AV / Protocolo',window:'Día 2 · mañana (aprox. 09:00–09:30)',type:'puntual',roles:['coo','marketing'],dep:'F3-04 escaleta de apertura; F1-02 orden de sponsors; F2-03 AV operativo.',steps:['Montar área de corte de listón o ceremonia de apertura antes de que lleguen los asistentes al salón.','Preparar orden del acto: himno o música institucional, palabras del CEO/directivos, presentación de edición y sede, agradecimiento a sponsors principales, corte de listón y foto oficial.','Coordinar con protocolo: posiciones de oradores, tiempo de cada intervención (máximo 3–4 minutos por orador).','Pantallas: slides de apertura con nombre del evento, edición, año, sede y logos de sponsors en orden de categoría.','Confirmar que el salón de One-to-One está listo para abrir inmediatamente después de la ceremonia.','Fotógrafo en posición para corte de listón y foto grupal de directivos y sponsors en el escenario.'],evidence:'Fotos de corte de listón y oradores; escaleta ejecutada; hora real de inicio y cierre.',control:'La apertura no debe rebasar los 30 minutos para no comprometer el primer bloque de reuniones.',deviation:'Retraso de asistentes: iniciar con quorum razonable. Falla de AV: continuar el acto en vivo sin apoyo de pantalla.'},
  {id:'eje-04',code:'EJE-04',stage:'eje',title:'Días 2 y 3 — Reuniones One-to-One',owner:'Sistemas / Eventos',support:'Ventas / COO',window:'Cuatro bloques: Día 2 mañana, Día 2 tarde, Día 3 mañana, Día 3 tarde',type:'continuo',roles:['sistemas','eventos','ventas','coo'],dep:'F3-01 scheduler configurado; EJE-03 apertura completa; salón habilitado con mesas numeradas.',steps:['Verificar que todas las mesas estén numeradas y en posición antes de abrir cada bloque.','Asignar mesa de coordinación con cronómetro, pantalla de anuncios, megáfono o sistema de señal y listado de cambios autorizados.','Comunicar antes de cada bloque: duración de reunión (20 min), señal de inicio, señal de fin y protocolo de No Show.','Mesas VIP con asignación fija confirmada antes de abrir; mesas estándar con rotación según scheduler.','Registrar en tiempo real: No Shows, cambios de mesa autorizados, solicitudes adicionales y problemas técnicos del scheduler.','Mantener coffee break disponible y continuo durante las sesiones.','Al final de cada jornada: contabilizar reuniones realizadas vs agendadas; reportar al COO y actualizar bitácora.','Habilitar espacio o proceso para que los agentes soliciten reuniones adicionales fuera del scheduler si queda capacidad.'],evidence:'Conteo de reuniones realizadas, No Shows registrados, cambios autorizados y reporte de incidencias técnicas del scheduler por bloque.',control:'El No Show tiene consecuencias definidas desde la convocatoria; el staff no puede modificar esas reglas en campo sin autorización del COO.',deviation:'Falla del scheduler digital: activar agendas exportadas/impresas y registro manual de cambios.'},
  {id:'eje-05',code:'EJE-05',stage:'eje',title:'Día 2 — Fotografía grupal oficial',owner:'Eventos / Marketing',support:'COO / Fotógrafo',window:'Día 2 · entre bloques de 1:1 (aprox. 12:20–13:00)',type:'puntual',roles:['eventos','marketing','coo'],dep:'F3-03 playera del grupo disponible; F2-03 fotógrafo briefeado.',steps:['Confirmar que todos los asistentes tienen la playera de grupo desde el kit; comunicar con anticipación que la usarán para la foto.','Elegir locación con iluminación natural o artificial adecuada, fondo limpio, sin logotipos de terceros.','Coordinar con el fotógrafo la disposición en filas, el encuadre, la señal de captura y el número de tomas.','Aprovechar el momento para fotos adicionales: directivos, sponsors, nuevos miembros.','Estimar tiempo real de convocatoria, foto y dispersión para no comprometer el inicio del almuerzo.'],evidence:'Fotografía grupal oficial validada en campo (encuadre, enfoque, todos visibles) y fotos adicionales requeridas completadas.',control:'La foto no puede quedar para "después" — es evidencia institucional.',deviation:'Si llueve o la locación falla, usar lobby o salón disponible.'},
  {id:'eje-06',code:'EJE-06',stage:'eje',title:'Día 2 — Noche libre y actividad social opcional',owner:'Ventas / Eventos',support:'Marketing / COO',window:'Día 2 · noche',type:'puntual',roles:['ventas','eventos','marketing','coo'],steps:['La noche es formalmente libre; sin embargo, Americas Alliance puede facilitar una opción grupal sin costo cubierto o con costo cubierto parcialmente según decisión previa.','Si se ofrece una opción grupal, comunicar con anticipación: venue, hora de salida, costo, punto de retorno y si el transporte está incluido.','No obligar asistencia; quien prefiera otro plan lo hace por su cuenta y sin cobertura de AA.','Si se organiza transporte de ida y vuelta, aplicar el procedimiento F3-02.','No programar actividades protocolares ni compromisos de sponsor en esta noche.'],evidence:'Nota de asistencia (si aplica) y registro de cualquier incidencia reportada.',control:'El consumo de alcohol en actividades no organizadas por AA es responsabilidad individual.'},

let currentStage='home', currentRole='all', checks={}, procStatus={}, stepStatus={};
function saveChecks(){try{localStorage.setItem('aa_v3',JSON.stringify(checks));}catch(e){}}
function saveStatus(){try{localStorage.setItem('aa_v3_st',JSON.stringify(procStatus));}catch(e){}}
function saveStepStatus(){try{localStorage.setItem('aa_v3_ss',JSON.stringify(stepStatus));}catch(e){}}
function loadChecks(){try{const d=localStorage.getItem('aa_v3');if(d)checks=JSON.parse(d);}catch(e){}}
function loadStatus(){try{const d=localStorage.getItem('aa_v3_st');if(d)procStatus=JSON.parse(d);}catch(e){}}
function loadStepStatus(){try{const d=localStorage.getItem('aa_v3_ss');if(d)stepStatus=JSON.parse(d);}catch(e){}}
loadChecks(); loadStatus(); loadStepStatus();
// Theme toggle
(function(){
  const btn=document.getElementById('theme-toggle');
  const saved=localStorage.getItem('aa_theme')||'light';
  if(saved==='dark'){document.documentElement.setAttribute('data-theme','dark');btn.textContent='☀️';btn.title='Cambiar a modo claro';}
  btn.addEventListener('click',function(){
    const isDark=document.documentElement.getAttribute('data-theme')==='dark';
    if(isDark){document.documentElement.removeAttribute('data-theme');btn.textContent='🌙';btn.title='Cambiar a modo oscuro';localStorage.setItem('aa_theme','light');}
    else{document.documentElement.setAttribute('data-theme','dark');btn.textContent='☀️';btn.title='Cambiar a modo claro';localStorage.setItem('aa_theme','dark');}
  });
})();

function stageColor(id){const s=STAGES.find(x=>x.id===id);return s?s.color:'var(--indigo)';}
function typeBadge(type){
  if(type==='puntual')return'<span class="badge badge-type puntual">⚡ PUNTUAL</span>';
  return'<span class="badge badge-type">↻ CONTINUO</span>';
}

function renderNav(){
  const nav=document.getElementById('topnav');
  nav.innerHTML='<div id="brand"><div class="dot"></div>AA Manual</div>';
  STAGES.forEach(s=>{
    const btn=document.createElement('button');
    btn.className='nav-btn'+(currentStage===s.id?' active':'');
    btn.style.setProperty('--phase-color',s.color);
    btn.dataset.action='go';
    btn.dataset.stage=s.id;
    btn.setAttribute('aria-current',currentStage===s.id?'page':'false');
    btn.innerHTML=`<span>${s.label}</span>${s.hint?`<span class="hint">${s.hint}</span>`:''}`;
    nav.appendChild(btn);
  });
}

function renderRoleBar(){
  document.querySelectorAll('.role-btn').forEach(b=>{
    const active=b.dataset.role===currentRole;
    b.classList.toggle('active',active);
    b.setAttribute('aria-pressed',active?'true':'false');
  });
}

function updateRoleCounts(){
  const roles=['all','coo','ventas','marketing','sistemas','finanzas','eventos'];
  const stageProcs=PROCS.filter(p=>p.stage===currentStage);
  roles.forEach(r=>{
    const el=document.getElementById('rc-'+r);
    if(!el)return;
    if(stageProcs.length===0){el.textContent='';return;}
    const count=r==='all'?stageProcs.length:stageProcs.filter(p=>p.roles.includes(r)).length;
    el.textContent=count>0?count:'';
  });
}

function renderProc(p){
  const c=stageColor(p.stage);
  const isVisible=currentRole==='all'||p.roles.includes(currentRole);
  const STEP_IC={pending:['○','Pendiente'],active:['◑','En proceso'],done:['✓','Listo'],blocked:['✕','Bloqueado']};
  const done=p.steps.filter((_,i)=>(stepStatus[p.id+'-'+i]||'pending')==='done').length;
  const pct=p.steps.length>0?Math.round(done/p.steps.length*100):0;

  const stepsHtml=p.steps.map((s,i)=>{
    const k=p.id+'-'+i;
    const st=stepStatus[k]||'pending';
    const lc=st==='done'?' checked':st==='blocked'?' blocked':'';
    return`<div class="check-item">
      <button class="step-status-btn" data-action="cycleStep" data-key="${k}" data-status="${st}" title="Clic para cambiar estado"><span class="ss-icon">${STEP_IC[st][0]}</span>${STEP_IC[st][1]}</button>
      <span class="check-label${lc}">${s}</span>
    </div>`;
  }).join('');

  let html=`<article class="proc-card${isVisible?'':' hidden'}" id="card-${p.id}" style="--c:${c}">
    <div class="proc-header" data-action="go" data-stage="${p.id}-toggle" role="button" tabindex="0" aria-expanded="false">
      <div class="proc-meta">
        <div class="proc-code">${p.code}</div>
        <div class="proc-title">${p.title}</div>
        <div class="proc-info">
          <span class="badge badge-owner">${p.owner}</span>
          <span class="badge badge-window">${p.window}</span>
          ${typeBadge(p.type)}
        </div>
        <div class="status-row" onclick="event.stopPropagation()">
          ${[['pending','□','Pendiente'],['active','●','En proceso'],['done','✓','Completado'],['blocked','×','Bloqueado']].map(([v,ic,lb])=>`<button class="status-btn s-${v}${(procStatus[p.id]||'pending')===v?' on':''}" data-action="setStatus" data-proc="${p.id}" data-val="${v}">${ic} ${lb}</button>`).join('')}
        </div>
        ${p.steps.length>0?`<div class="progress-wrap"><div class="progress-label"><span>Pasos</span><span>${pct}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>`:''}
      </div>
      <div class="proc-toggle" aria-hidden="true">▸</div>
    </div>
    <div class="proc-body" id="body-${p.id}">`;

  if(p.dep) html+=`<div class="dep-box">⤷ <strong>Entrada:</strong> ${p.dep}</div>`;
  if(p.hitos) html+=`<div class="hitos-box"><strong>Hitos:</strong> ${p.hitos}</div>`;

  html+=`<div class="steps-list"><div class="steps-label">Pasos</div>${stepsHtml}</div>`;
  html+=`<div class="meta-grid">`;
  html+=`<div class="meta-box full"><h4>Evidencia de cierre</h4><p>${p.evidence}</p></div>`;
  if(p.control) html+=`<div class="meta-box"><h4>Punto de control</h4><p>${p.control}</p></div>`;
  if(p.deviation) html+=`<div class="meta-box warn"><h4>Si hay desviación</h4><p>${p.deviation}</p></div>`;
  html+=`</div></div></article>`;
  return html;
}

function renderStage(){
  const main=document.getElementById('main');
  if(currentStage==='home'){renderHome(main);return;}
  if(currentStage==='gov'){renderGov(main);return;}
  if(currentStage==='ft'){renderFT(main);return;}
  if(currentStage==='kpi'){renderKPI(main);return;}
  if(currentStage==='anexos'){renderAnexos(main);return;}

  const st=STAGES.find(s=>s.id===currentStage);
  if(!st){main.innerHTML='';return;}
  const procs=PROCS.filter(p=>p.stage===currentStage);
  const gate=GATES[currentStage];
  const desc=PHASE_DESC[currentStage]||'';

  let html=`<div class="section-header"><h2>${st.label}</h2><p>${desc}</p></div>`;
  if(gate) html+=`<div class="gate-box"><span class="lock">🔒</span><p><strong>PUERTA DE SALIDA:</strong> ${gate}</p></div>`;
  if(procs.length===0){
    html+=`<p style="color:var(--text3);font-size:15px;margin-top:20px;font-weight:500">Sin procedimientos en esta sección.</p>`;
  } else {
    html+=`<div class="proc-grid">`;
    procs.forEach(p=>{html+=renderProc(p);});
    html+=`</div>`;
  }
  main.innerHTML=html;
}

function toggleProc(procId){
  const body=document.getElementById('body-'+procId);
  const header=document.querySelector(`#card-${procId} .proc-header`);
  if(!body)return;
  const isOpen=body.classList.contains('open');
  body.classList.toggle('open',!isOpen);
  if(header) header.setAttribute('aria-expanded',!isOpen);
  const toggle=document.querySelector(`#card-${procId} .proc-toggle`);
  if(toggle) toggle.textContent=isOpen?'▸':'▾';
}

const STEP_IC_G={pending:['○','Pendiente'],active:['◑','En proceso'],done:['✓','Listo'],blocked:['✕','Bloqueado']};
function cycleStep(key){
  const order=['pending','active','done','blocked'];
  const cur=stepStatus[key]||'pending';
  const next=order[(order.indexOf(cur)+1)%order.length];
  stepStatus[key]=next;
  saveStepStatus();
  const btn=document.querySelector(`[data-action="cycleStep"][data-key="${key}"]`);
  if(btn){
    btn.setAttribute('data-status',next);
    btn.innerHTML=`<span class="ss-icon">${STEP_IC_G[next][0]}</span>${STEP_IC_G[next][1]}`;
    btn.title='Clic para cambiar estado';
    const label=btn.closest('.check-item')?.querySelector('.check-label');
    if(label) label.className='check-label'+(next==='done'?' checked':next==='blocked'?' blocked':'');
  }
  const parts=key.split('-');
  const procId=parts.slice(0,parts.length-1).join('-');
  const proc=PROCS.find(p=>p.id===procId);
  if(proc&&proc.steps.length>0){
    const done=proc.steps.filter((_,i)=>(stepStatus[procId+'-'+i]||'pending')==='done').length;
    const pct=Math.round(done/proc.steps.length*100);
    const fill=document.querySelector('#card-'+procId+' .progress-fill');
    if(fill) fill.style.width=pct+'%';
    const lbl=document.querySelector('#card-'+procId+' .progress-label span:last-child');
    if(lbl) lbl.textContent=pct+'%';
  }
}
function toggleCheck(key,val){checks[key]=val;saveChecks();}

function go(id){
  if(id&&id.endsWith('-toggle')){toggleProc(id.replace('-toggle',''));return;}
  currentStage=id;
  renderNav();
  renderStage();
  updateRoleCounts();
  window.scrollTo({top:0,behavior:'smooth'});
}

function setStatus(procId,val){
  procStatus[procId]=val;
  saveStatus();
  document.querySelectorAll(`[data-action="setStatus"][data-proc="${procId}"]`).forEach(b=>{
    b.classList.toggle('on',b.dataset.val===val);
  });
}

function setRole(role){
  currentRole=role;
  renderRoleBar();
  PROCS.forEach(p=>{
    const card=document.getElementById('card-'+p.id);
    if(!card)return;
    card.classList.toggle('hidden',role!=='all'&&!p.roles.includes(role));
  });
  updateRoleCounts();
}

document.addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key===' '){
    const el=e.target.closest('[data-action="go"],[data-action="setRole"]');
    if(el){e.preventDefault();el.click();}
  }
});
document.addEventListener('click',function(e){
  const cyEl=e.target.closest('[data-action="cycleStep"]');
  if(cyEl){e.stopPropagation();cycleStep(cyEl.dataset.key);return;}
  const stEl=e.target.closest('[data-action="setStatus"]');
  if(stEl){setStatus(stEl.dataset.proc,stEl.dataset.val);return;}
  const goEl=e.target.closest('[data-action="go"]');
  if(goEl){go(goEl.dataset.stage);return;}
  const roleEl=e.target.closest('[data-action="setRole"]');
  if(roleEl){setRole(roleEl.dataset.role);return;}
});

renderNav();
renderStage();
updateRoleCounts();
</script>
</body>
</html>
